name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy backend (Render / Railway)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Trigger Render deploy hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  build-frontend:
    name: Build frontend (Expo / EAS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Instruções de publicação
        run: |
          echo "Para publicar no EAS, configure o token EXPO_TOKEN e descomente as linhas abaixo."
          echo "npx eas-cli build --platform all --non-interactive"
